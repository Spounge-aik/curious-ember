<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fiskeappen – Fiske pågår</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page-content" style="padding:20px 16px">

  <button class="back-btn mb-5" onclick="history.back()">
    <i data-lucide="chevron-left" class="icon"></i> Tillbaka
  </button>

  <div class="session-header mb-6">
    <p class="sh-label">Fiske pågår</p>
    <p class="sh-lake" id="session-lake">Laddar…</p>
    <div class="sh-fish">
      <i data-lucide="fish" id="session-fish-emoji" style="width:20px;height:20px"></i>
      <span id="session-fish" class="font-bold"></span>
    </div>
    <p class="sh-time" id="session-time"></p>
  </div>

  <div id="loading-state">
    <div class="flex flex-col gap-3 mb-6">
      <div class="skeleton skeleton-text" style="width:40%"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
    <div class="flex flex-col gap-3">
      <div class="skeleton skeleton-text" style="width:40%"></div>
      <div class="grid grid-cols-2 gap-3">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>
  </div>

  <div id="error-state" class="alert alert-error" style="display:none"></div>

  <div id="rec-content" style="display:none">
    <div id="tip-box" class="alert alert-tip mb-5" style="display:none">
      <p class="font-bold text-xs uppercase mb-1" style="letter-spacing:.06em">Tips</p>
      <p id="tip-text" class="text-sm"></p>
    </div>
    <div id="rods-section" class="mb-7" style="display:none">
      <p class="section-title">Rekommenderade spön</p>
      <div id="rods-list" class="flex flex-col gap-2"></div>
    </div>
    <div id="lures-section" class="mb-6" style="display:none">
      <p class="section-title">Rekommenderade beten</p>
      <div id="lures-list" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
    </div>
    <div id="empty-rec" class="empty-state" style="display:none">
      <i data-lucide="inbox" class="empty-icon-svg"></i>
      <p class="font-bold mb-1">Tomt bibliotek</p>
      <p class="text-sm text-muted mb-5">Lägg till utrustning för att få rekommendationer.</p>
      <a href="library.html" class="btn btn-primary" style="text-decoration:none">
        <i data-lucide="plus" class="icon"></i> Gå till Utrustning
      </a>
    </div>
  </div>

</main>

<nav id="bottom-nav"></nav>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
