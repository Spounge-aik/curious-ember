<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Curious Ember – Fiske pågår</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main style="padding:28px 16px 16px">

  <button class="back-btn" onclick="history.back()" style="margin-bottom:20px">← Tillbaka</button>

  <!-- Session header -->
  <div class="session-header" style="margin-bottom:24px">
    <p class="sh-label">Aktivt fiske</p>
    <p class="sh-lake" id="session-lake">Laddar…</p>
    <div class="sh-fish">
      <span style="font-size:22px">🐟</span>
      <span id="session-fish"></span>
    </div>
    <p class="sh-time" id="session-time"></p>
  </div>

  <!-- Laddar -->
  <div id="loading-state" style="text-align:center;padding:48px 0">
    <div style="font-size:40px;margin-bottom:12px">🤖</div>
    <p style="font-weight:700;margin-bottom:4px">Analyserar ditt bibliotek</p>
    <p class="text-sm text-muted">Hämtar AI-rekommendationer…</p>
  </div>

  <!-- Fel -->
  <div id="error-state" class="alert alert-error" style="display:none"></div>

  <!-- Rekommendationer -->
  <div id="rec-content" style="display:none">

    <div id="tip-box" class="alert alert-tip" style="display:none;margin-bottom:20px">
      <p style="font-weight:700;margin-bottom:4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em">💡 Tips</p>
      <p id="tip-text"></p>
    </div>

    <div id="rods-section" style="display:none;margin-bottom:24px">
      <p class="section-title">🎣 Rekommenderade spön</p>
      <div id="rods-list" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <div id="lures-section" style="display:none;margin-bottom:24px">
      <p class="section-title">🪝 Rekommenderade beten</p>
      <div id="lures-list" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <div id="empty-rec" class="empty-state" style="display:none">
      <div class="empty-icon">📭</div>
      <p style="font-weight:700;margin-bottom:6px">Tomt bibliotek</p>
      <p class="text-sm text-muted">Lägg till utrustning under Bibliotek för att få rekommendationer.</p>
    </div>

  </div>
</main>

<nav id="bottom-nav"></nav>
<script type="module" src="script.js"></script>
</body>
</html>
