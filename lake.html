<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Curious Ember – Välj fisk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main style="padding:28px 16px 16px">

  <button class="back-btn" onclick="history.back()" style="margin-bottom:20px">← Tillbaka</button>

  <div style="margin-bottom:8px">
    <h1 id="lake-name" style="font-size:1.4rem">Laddar…</h1>
    <p id="lake-county" class="text-muted text-sm" style="margin-top:2px"></p>
  </div>

  <!-- Fisk-räknare -->
  <div id="fish-count-badge" style="display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:24px">
    <span id="fish-count-text" class="text-sm" style="color:var(--text-2)">🐟 Hämtar fiskarter från Artportalen…</span>
    <span id="source-badge" class="badge" style="display:none">Artportalen</span>
  </div>

  <h2 style="margin-bottom:14px;font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)">Välj målfisk</h2>

  <div id="fish-grid" class="fish-grid"></div>

  <!-- Vald fisk + CTA -->
  <div id="selected-wrap" style="display:none" class="cta-sticky">
    <div class="card card-body" style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <span style="font-size:26px">🐟</span>
      <div>
        <p class="text-xs text-muted" style="text-transform:uppercase;letter-spacing:.06em">Du fiskar</p>
        <p id="selected-fish-name" style="font-weight:700;font-size:1rem;color:var(--accent)"></p>
      </div>
    </div>
    <button class="btn btn-primary btn-full btn-lg" id="btn-start">🎣 Starta fiske!</button>
  </div>

</main>

<nav id="bottom-nav"></nav>
<script type="module" src="script.js"></script>
</body>
</html>
