<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fiskeappen – Välj fisk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page-content" style="padding:20px 16px">

  <button class="back-btn mb-5" onclick="history.back()">
    <i data-lucide="chevron-left" class="icon"></i> Tillbaka
  </button>

  <div class="mb-4">
    <h1 id="lake-name" class="text-2xl font-bold">Laddar…</h1>
    <p id="lake-county" class="text-sm text-muted mt-1"></p>
  </div>

  <div class="flex items-center justify-between mb-6 p-3 rounded-xl" style="background:var(--surface);border:1px solid var(--border-soft)">
    <span id="fish-count-text" class="text-sm text-muted">Hämtar fiskarter…</span>
    <span id="source-badge" class="badge" style="display:none">Artportalen</span>
  </div>

  <!-- Djupkarta (visas bara om sjön har smhiId) -->
  <div id="depth-map-section" style="display:none;margin-bottom:20px">
    <p class="section-title" style="margin-bottom:8px">Djupkarta</p>
    <div id="depth-map-wrap" style="background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border-soft);overflow:hidden">
      <button id="btn-show-depth" class="btn btn-surface btn-full" style="border-radius:0;border:none">
        <i data-lucide="layers" class="icon"></i> Visa djupkarta (SMHI)
      </button>
      <div id="depth-map-canvas-wrap" style="display:none;padding:12px;text-align:center">
        <div id="depth-map-loading" class="text-muted" style="font-size:.8rem;padding:20px 0">
          <i data-lucide="loader" class="icon" style="animation:spin 1s linear infinite"></i> Laddar karta…
        </div>
        <canvas id="depth-map-canvas" style="display:none;width:100%;height:auto;border-radius:12px;max-height:400px"></canvas>
        <p style="font-size:.65rem;color:var(--text-3);margin-top:6px">Källa: SMHI SVAR · Lantmäteriet</p>
      </div>
    </div>
  </div>

  <p class="section-title">Välj målfisk</p>

  <div id="fish-skeleton" class="grid grid-cols-2 gap-3" style="display:none">
    <div class="skeleton" style="height:130px;border-radius:20px"></div>
    <div class="skeleton" style="height:130px;border-radius:20px"></div>
    <div class="skeleton" style="height:130px;border-radius:20px"></div>
    <div class="skeleton" style="height:130px;border-radius:20px"></div>
  </div>

  <div id="fish-grid" class="grid grid-cols-2 gap-3" style="display:none"></div>

  <div id="selected-wrap" class="cta-sticky" style="display:none">
    <div class="card card-body flex items-center gap-3 mb-3">
      <i data-lucide="fish" id="selected-fish-emoji" style="width:28px;height:28px;color:var(--accent)"></i>
      <div>
        <p class="text-xs text-muted uppercase" style="letter-spacing:.06em">Du fiskar</p>
        <p id="selected-fish-name" class="font-bold text-base" style="color:var(--accent)"></p>
      </div>
    </div>
    <button class="btn btn-primary btn-full btn-lg btn-pulse" id="btn-start">
      <i data-lucide="fish" class="icon"></i> Starta fiske!
    </button>
  </div>

</main>

<nav id="bottom-nav"></nav>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tiff.js@1.0.0/tiff.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
