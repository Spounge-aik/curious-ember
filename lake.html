<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fiskeappen – Välj fisk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page-content" style="padding:20px 16px">

  <button class="back-btn mb-5" onclick="history.back()">
    <i data-lucide="chevron-left" class="icon"></i> Tillbaka
  </button>

  <div class="mb-4">
    <h1 id="lake-name" class="text-2xl font-bold">Laddar…</h1>
    <p id="lake-county" class="text-sm text-muted mt-1"></p>
  </div>

  <div class="flex items-center justify-between mb-6 p-3 rounded-xl" style="background:var(--surface);border:1px solid var(--border-soft)">
    <span id="fish-count-text" class="text-sm text-muted">Hämtar fiskarter…</span>
    <span id="source-badge" class="badge" style="display:none">Artportalen</span>
  </div>

  <p class="section-title">Välj målfisk</p>

  <div id="fish-skeleton" class="grid grid-cols-2 gap-3" style="display:none">
    <div class="skeleton" style="height:130px;border-radius:20px"></div>
    <div class="skeleton" style="height:130px;border-radius:20px"></div>
    <div class="skeleton" style="height:130px;border-radius:20px"></div>
    <div class="skeleton" style="height:130px;border-radius:20px"></div>
  </div>

  <div id="fish-grid" class="grid grid-cols-2 gap-3" style="display:none"></div>

  <!-- Anteckningar -->
  <div id="lake-notes-section" class="mt-6">
    <p class="section-title mb-3">Mina anteckningar</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px">
      <textarea id="lake-note-input" placeholder="T.ex. bra vid vindstilla, norra viken producerar på morgonen…"
                style="width:100%;min-height:80px;resize:vertical;padding:10px 12px;border-radius:var(--radius);
                       background:var(--surface);border:1px solid var(--border-soft);color:var(--text);
                       font-size:.85rem;font-family:inherit;line-height:1.5"></textarea>
      <button id="btn-save-note" class="btn btn-surface" style="align-self:flex-end">
        <i data-lucide="save" style="width:14px;height:14px"></i> Spara
      </button>
    </div>
    <div id="lake-notes-list" class="flex flex-col gap-2"></div>
  </div>

  <div id="selected-wrap" class="cta-sticky" style="display:none">
    <div class="card card-body flex items-center gap-3 mb-3">
      <i data-lucide="fish" id="selected-fish-emoji" style="width:28px;height:28px;color:var(--accent)"></i>
      <div>
        <p class="text-xs text-muted uppercase" style="letter-spacing:.06em">Du fiskar</p>
        <p id="selected-fish-name" class="font-bold text-base" style="color:var(--accent)"></p>
      </div>
    </div>
    <button class="btn btn-primary btn-full btn-lg btn-pulse" id="btn-start">
      <i data-lucide="fish" class="icon"></i> Starta fiske!
    </button>
  </div>

</main>

<!-- Fiskvals-overlay -->
<div id="fish-overlay" style="display:none;position:fixed;inset:0;z-index:500;
     background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch">
  <div style="padding:20px 16px 40px">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <button id="fish-overlay-close" class="icon-btn">
        <i data-lucide="chevron-left" style="width:20px;height:20px"></i>
      </button>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="fo-emoji" style="font-size:30px"></span>
        <div>
          <div id="fo-name" style="font-weight:700;font-size:1.1rem"></div>
          <div id="fo-tag" class="text-xs text-muted"></div>
        </div>
      </div>
    </div>

    <!-- Info-rader -->
    <div id="fo-info-rows" class="mb-6"
         style="background:var(--surface);border-radius:var(--radius-lg);
                padding:14px 16px;border:1px solid var(--border-soft)"></div>

    <!-- Vattenklarhet -->
    <div class="mb-6">
      <p class="section-title mb-1">Hur mörkt är vattnet?</p>
      <p id="fo-clarity-label" style="font-size:1rem;font-weight:700;margin:8px 0"></p>
      <input type="range" id="fo-clarity-slider" min="0" max="3" step="1" value="0"
             style="width:100%;height:6px;border-radius:3px;outline:none;
                    appearance:none;-webkit-appearance:none;cursor:pointer;
                    margin-bottom:6px;
                    background:linear-gradient(to right,#b3e0ff,#1a3a5c)">
      <div style="display:flex;justify-content:space-between">
        <span class="text-xs text-muted">💎 Klart</span>
        <span class="text-xs text-muted">⚫ Mycket mörkt</span>
      </div>
      <p id="fo-clarity-tip" class="text-xs text-muted mt-2" style="min-height:1.2em"></p>
    </div>

    <!-- Målvikt -->
    <div class="mb-8">
      <p class="section-title mb-1">Hur stor fisk siktar du på?</p>
      <p id="fo-weight-value" style="font-size:1.4rem;font-weight:700;color:var(--accent);margin:8px 0"></p>
      <input type="range" id="fo-weight-slider" style="width:100%;height:6px;border-radius:3px;
             outline:none;appearance:none;-webkit-appearance:none;cursor:pointer;margin-bottom:6px">
      <div style="display:flex;justify-content:space-between">
        <span class="text-xs text-muted">0</span>
        <span id="fo-rec-label" class="text-xs" style="color:var(--accent)"></span>
        <span id="fo-weight-max" class="text-xs text-muted"></span>
      </div>
    </div>

    <!-- Starta fiske -->
    <button id="fo-start-btn" class="btn btn-primary btn-full btn-lg btn-pulse">
      <i data-lucide="fish" class="icon"></i> Starta fiske!
    </button>

  </div>
</div>

<nav id="bottom-nav"></nav>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
