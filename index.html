<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Curious Ember – Fiske</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<main style="padding:24px 16px 16px">
  <div style="margin-bottom:20px">
    <h1 style="font-size:24px;font-weight:700;color:#075985">🔥 Curious Ember</h1>
    <p style="color:#6b7280;margin-top:4px">Din smarta fiskeassistent</p>
  </div>

  <!-- Knappar -->
  <div style="display:flex;gap:10px;margin-bottom:16px">
    <button class="btn btn-primary btn-half" id="btn-gps">📍 Hitta min sjö</button>
    <button class="btn btn-outline btn-half" id="btn-search-toggle">🔍 Sök sjö</button>
  </div>

  <!-- Sökfält -->
  <div id="search-box" style="display:none;margin-bottom:16px">
    <input type="text" id="search-input" placeholder="Sök sjö, t.ex. Vättern…" autocomplete="off">
  </div>

  <!-- Status -->
  <p id="status-msg" style="text-align:center;color:#6b7280;font-size:14px;margin-bottom:12px;display:none"></p>

  <!-- Karta -->
  <div id="map" style="display:none;margin-bottom:16px"></div>

  <!-- Sjölista -->
  <div id="lake-section" style="display:none">
    <p class="section-title" id="lake-list-title">Närmaste sjöar</p>
    <div id="lake-list" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <!-- CTA -->
  <div id="cta-wrap" style="display:none;position:sticky;bottom:80px;background:linear-gradient(to top,#f9fafb 60%,transparent);padding-top:16px;margin-top:12px">
    <button class="btn btn-ember btn-full" id="btn-start" style="font-size:17px">
      🎣 Starta fiske
    </button>
  </div>

  <!-- Tom state -->
  <div id="empty-state" class="empty-state">
    <div class="empty-icon">🏞️</div>
    <p>Tryck på "Hitta min sjö" för att komma igång</p>
    <p style="font-size:13px;margin-top:4px">eller sök efter en specifik sjö</p>
  </div>
</main>

<nav id="bottom-nav"></nav>

<script type="module" src="script.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
