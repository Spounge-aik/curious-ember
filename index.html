<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Curious Ember – Sjöar</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page-content" style="padding:20px 16px">

  <!-- CTA-knappar -->
  <div style="display:flex;gap:10px;margin-bottom:20px">
    <button class="btn btn-primary btn-half btn-pulse" id="btn-gps">📍 Hitta min sjö</button>
    <button class="btn btn-surface btn-half" id="btn-search-toggle">🔍 Sök sjö</button>
  </div>

  <!-- Sökfält -->
  <div id="search-box" style="display:none;margin-bottom:16px">
    <input type="text" id="search-input" placeholder="Sök sjö, t.ex. Vättern…" autocomplete="off">
  </div>

  <!-- GPS skeleton -->
  <div id="gps-skeleton" style="display:none;margin-bottom:16px">
    <div class="skeleton" style="height:72px;border-radius:var(--radius-lg)"></div>
  </div>

  <!-- GPS-widget -->
  <div id="gps-widget" style="display:none;margin-bottom:16px">
    <div class="gps-card">
      <div class="gps-dot"></div>
      <div class="gps-info">
        <p class="gps-label">Live GPS · Närmaste sjö</p>
        <p class="gps-name" id="gps-lake-name">—</p>
        <p class="gps-dist" id="gps-lake-dist"></p>
      </div>
      <button class="btn btn-surface btn-sm" id="gps-select-btn">Välj</button>
    </div>
  </div>

  <!-- Status -->
  <p id="status-msg" style="text-align:center;font-size:.78rem;margin-bottom:12px;display:none;color:var(--text-3)"></p>

  <!-- Karta -->
  <div id="map" style="display:none;margin-bottom:16px"></div>

  <!-- Sjölista skeleton -->
  <div id="lake-skeleton" style="display:none">
    <p class="section-title" style="margin-bottom:10px">Närmaste sjöar</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${[1,2,3,4].map(()=>`
        <div class="skeleton" style="height:60px;border-radius:var(--radius-lg)"></div>
      `).join('')}
    </div>
  </div>

  <!-- Sjölista -->
  <div id="lake-section" style="display:none">
    <p class="section-title" id="lake-list-title" style="margin-bottom:10px">Närmaste sjöar</p>
    <div id="lake-list" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <!-- CTA -->
  <div id="cta-wrap" style="display:none" class="cta-sticky">
    <button class="btn btn-primary btn-full btn-lg" id="btn-start">🎣 Starta fiske</button>
  </div>

  <!-- Tom state -->
  <div id="empty-state" class="empty-state">
    <div class="empty-icon">🏞️</div>
    <p style="font-weight:700;margin-bottom:6px">Hitta ditt fiskevatten</p>
    <p class="text-sm text-muted">Tryck "Hitta min sjö" eller sök manuellt</p>
  </div>

</main>

<nav id="bottom-nav"></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
