<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Curious Ember – Fiske</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<main style="padding:28px 16px 16px">

  <!-- Header -->
  <div style="margin-bottom:24px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <span style="font-size:22px">🔥</span>
      <h1 style="font-size:1.4rem;letter-spacing:-.01em">Curious Ember</h1>
    </div>
    <p class="text-muted text-sm">Din smarta fiskeassistent</p>
  </div>

  <!-- Knappar -->
  <div style="display:flex;gap:10px;margin-bottom:16px">
    <button class="btn btn-primary btn-half" id="btn-gps">📍 Hitta min sjö</button>
    <button class="btn btn-surface btn-half" id="btn-search-toggle">🔍 Sök sjö</button>
  </div>

  <!-- Sökfält -->
  <div id="search-box" style="display:none;margin-bottom:16px">
    <input type="text" id="search-input" placeholder="Sök sjö, t.ex. Vättern…" autocomplete="off">
  </div>

  <!-- Status -->
  <p id="status-msg" style="text-align:center;font-size:.8rem;margin-bottom:12px;display:none;color:var(--text-3)"></p>

  <!-- Karta -->
  <div id="map" style="display:none;margin-bottom:16px"></div>

  <!-- Sjölista -->
  <div id="lake-section" style="display:none">
    <p class="section-title" id="lake-list-title">Närmaste sjöar</p>
    <div id="lake-list" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <!-- CTA -->
  <div id="cta-wrap" style="display:none" class="cta-sticky">
    <button class="btn btn-primary btn-full btn-lg" id="btn-start">
      🎣 Starta fiske
    </button>
  </div>

  <!-- Tom state -->
  <div id="empty-state" class="empty-state">
    <div class="empty-icon">🏞️</div>
    <p style="font-weight:700;margin-bottom:6px">Hitta ditt fiskevatten</p>
    <p class="text-sm text-muted">Tryck på "Hitta min sjö" eller sök manuellt</p>
  </div>

</main>

<nav id="bottom-nav"></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
