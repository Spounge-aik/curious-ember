<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fiskeappen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page-content" style="padding:24px 16px 40px">

  <div style="margin-bottom:28px">
    <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:4px">Välkommen</h1>
    <p class="text-sm text-muted">Vad vill du göra idag?</p>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">

    <a href="lakes.html" class="landing-card">
      <div class="landing-card-icon" style="background:rgba(232,112,26,.15)">
        <i data-lucide="map-pin" style="width:28px;height:28px;color:#E8701A"></i>
      </div>
      <div class="landing-card-title">Sjöar</div>
      <div class="landing-card-sub">Hitta fiskevatten och starta tur</div>
    </a>

    <a href="history.html" class="landing-card">
      <div class="landing-card-icon" style="background:rgba(74,158,202,.15)">
        <i data-lucide="fish" style="width:28px;height:28px;color:#4A9ECA"></i>
      </div>
      <div class="landing-card-title">Mitt Fiske</div>
      <div class="landing-card-sub">Dina fisketurer och historik</div>
    </a>

    <a href="catches.html" class="landing-card">
      <div class="landing-card-icon" style="background:rgba(93,187,106,.15)">
        <i data-lucide="award" style="width:28px;height:28px;color:#5DBB6A"></i>
      </div>
      <div class="landing-card-title">Fångster</div>
      <div class="landing-card-sub">Statistik och personliga rekord</div>
    </a>

    <a href="library.html" class="landing-card">
      <div class="landing-card-icon" style="background:rgba(202,74,158,.15)">
        <i data-lucide="anchor" style="width:28px;height:28px;color:#CA4A9E"></i>
      </div>
      <div class="landing-card-title">Utrustning</div>
      <div class="landing-card-sub">Spön, beten och bibliotek</div>
    </a>

    <a href="social.html" class="landing-card">
      <div class="landing-card-icon" style="background:rgba(93,187,106,.15)">
        <i data-lucide="users" style="width:28px;height:28px;color:#5DBB6A"></i>
      </div>
      <div class="landing-card-title">Social</div>
      <div class="landing-card-sub">Vänner, fångstfeed och crews</div>
    </a>

    <a href="forecast.html" class="landing-card">
      <div class="landing-card-icon" style="background:rgba(232,200,26,.15)">
        <i data-lucide="cloud-sun" style="width:28px;height:28px;color:#E8C81A"></i>
      </div>
      <div class="landing-card-title">Fiskeprognos</div>
      <div class="landing-card-sub">7-dagarsprognos per art och sjö</div>
    </a>

  </div>

</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
