<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Curious Ember – Utrustning</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page-content" style="padding:20px 16px">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <div>
      <h1 style="font-size:1.1rem">Utrustning</h1>
      <p class="text-muted text-xs" style="margin-top:2px">Ditt spö- och betebibliotek</p>
    </div>
    <button class="btn btn-primary btn-sm" id="btn-add">+ Lägg till</button>
  </div>

  <!-- Tabs -->
  <div class="tab-bar" style="margin-bottom:20px">
    <button class="tab-btn active" data-tab="rods">🎣 Spön (<span id="rod-count">0</span>)</button>
    <button class="tab-btn" data-tab="lures">🪝 Beten (<span id="lure-count">0</span>)</button>
  </div>

  <!-- Skeleton -->
  <div id="list-spinner">
    <div class="equipment-grid">
      ${[1,2,3,4].map(()=>`<div class="skeleton skeleton-card"></div>`).join('')}
    </div>
  </div>

  <!-- Grid -->
  <div id="item-grid" class="equipment-grid" style="display:none"></div>

  <!-- Tom state -->
  <div id="empty-lib" class="empty-state" style="display:none">
    <div class="empty-icon" id="empty-icon">🎣</div>
    <p style="font-weight:700;margin-bottom:6px" id="empty-text">Inga spön ännu</p>
    <p class="text-sm text-muted" style="margin-bottom:20px">Lägg till för att få AI-rekommendationer</p>
    <button class="btn btn-primary" id="btn-add-empty">+ Lägg till</button>
  </div>

</main>

<!-- Modal -->
<div id="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 id="modal-title" style="margin-bottom:20px;font-size:1rem"></h2>

    <!-- Bildförhandsvisning -->
    <div id="img-preview-wrap" style="display:none;margin-bottom:12px;position:relative">
      <img id="img-preview" src="" alt="" style="width:100%;height:160px;object-fit:contain;background:var(--surface-2);border-radius:var(--radius-lg)">
      <button onclick="window.__clearImage()" style="position:absolute;top:8px;right:8px;background:rgba(15,23,42,.8);border:none;color:var(--text-2);border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px">×</button>
    </div>

    <!-- Kamera-knappar -->
    <div id="img-buttons" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
      <button class="btn btn-surface" id="btn-camera" style="gap:6px">
        📷 Ta foto
      </button>
      <button class="btn btn-ghost" id="btn-gallery" style="gap:6px">
        🖼️ Välj bild
      </button>
    </div>
    <input type="file" id="file-camera"  accept="image/*" capture="environment" style="display:none">
    <input type="file" id="file-gallery" accept="image/*" style="display:none">

    <!-- AI-analysindikator -->
    <div id="ai-analyzing" style="display:none;text-align:center;padding:12px;background:var(--surface);border-radius:var(--radius);margin-bottom:16px">
      <p style="font-size:.8rem;color:var(--accent)">🤖 Analyserar bilden…</p>
    </div>

    <!-- AI-förslag-banner -->
    <div id="ai-suggestion-banner" style="display:none;background:var(--accent-dim);border:1px solid rgba(249,115,22,.3);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
      <p style="font-size:.78rem;color:var(--accent);font-weight:700">🤖 AI-förslag — granska och godkänn</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <input type="text" id="item-name" placeholder="Namn *">
      <textarea id="item-desc" placeholder="Beskrivning (valfritt)" rows="2"></textarea>

      <div id="lure-fields" style="display:none;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <input type="text" id="item-type"  placeholder="Typ">
        <input type="text" id="item-color" placeholder="Färg">
        <input type="text" id="item-size"  placeholder="Storlek">
      </div>

      <div>
        <div style="display:flex;gap:8px">
          <input type="text" id="tag-input" placeholder="Tagg, t.ex. gädda">
          <button class="btn btn-ghost btn-sm" id="btn-add-tag" style="white-space:nowrap;padding:10px 14px">+</button>
        </div>
        <div id="tag-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
      </div>

      <div style="display:flex;gap:10px;padding-top:4px">
        <button class="btn btn-ghost btn-half" id="btn-cancel">Avbryt</button>
        <button class="btn btn-primary btn-half" id="btn-save">Spara</button>
      </div>
    </div>
  </div>
</div>

<nav id="bottom-nav"></nav>
<script type="module" src="script.js"></script>
</body>
</html>
