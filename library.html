<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fiskeappen – Utrustning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page-content" style="padding:20px 16px">

  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-xl font-bold">Utrustning</h1>
      <p class="text-xs text-muted mt-1">Ditt spö- och betebibliotek</p>
    </div>
    <button class="btn btn-primary btn-sm" id="btn-add">
      <i data-lucide="plus" class="icon"></i> Lägg till
    </button>
  </div>

  <div class="tab-bar mb-5">
    <button class="tab-btn active" data-tab="rods">
      <i data-lucide="fish" class="icon"></i> Spön (<span id="rod-count">0</span>)
    </button>
    <button class="tab-btn" data-tab="lures">
      <i data-lucide="anchor" class="icon"></i> Beten (<span id="lure-count">0</span>)
    </button>
  </div>

  <!-- Sök + filter (visas bara för beten) -->
  <div id="filter-section" style="display:none;margin-bottom:16px">
    <input type="search" id="filter-search" placeholder="Sök bete…" autocomplete="off" style="margin-bottom:12px">
    <div id="filter-fish-wrap" style="display:none">
      <p class="section-title" style="margin-bottom:8px">Fiskart</p>
      <div id="filter-fish-chips" class="filter-chips"></div>
    </div>
    <div id="filter-type-wrap" style="display:none;margin-top:12px">
      <p class="section-title" style="margin-bottom:8px">Betestyp</p>
      <div id="filter-type-chips" class="filter-chips"></div>
    </div>
  </div>

  <div id="list-spinner">
    <div class="equipment-grid">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </div>

  <div id="item-grid" style="display:none"></div>

  <div id="empty-lib" class="empty-state" style="display:none">
    <i data-lucide="fish" class="empty-icon-svg" id="empty-icon"></i>
    <p class="font-bold mb-1" id="empty-text">Inga spön ännu</p>
    <p class="text-sm text-muted mb-5">Lägg till för att få AI-rekommendationer</p>
    <button class="btn btn-primary" id="btn-add-empty">
      <i data-lucide="plus" class="icon"></i> Lägg till
    </button>
  </div>

</main>

<!-- Modal -->
<div id="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 id="modal-title" class="font-bold mb-5" style="font-size:1rem"></h2>

    <div id="img-preview-wrap" style="display:none;position:relative;margin-bottom:12px">
      <img id="img-preview" src="" alt=""
           style="width:100%;height:160px;object-fit:contain;background:var(--surface-2);border-radius:20px">
      <button onclick="window.__clearImage()"
              style="position:absolute;top:8px;right:8px;background:rgba(18,24,36,.85);border:none;color:var(--text-2);border-radius:50%;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <i data-lucide="x" style="width:14px;height:14px;stroke:currentColor"></i>
      </button>
    </div>

    <div id="img-buttons" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
      <button class="btn btn-surface" id="btn-camera">
        <i data-lucide="camera" class="icon"></i> Ta foto
      </button>
      <button class="btn btn-ghost" id="btn-gallery">
        <i data-lucide="image" class="icon"></i> Välj bild
      </button>
    </div>
    <input type="file" id="file-camera"  accept="image/*" capture="environment" style="display:none">
    <input type="file" id="file-gallery" accept="image/*" style="display:none">

    <div id="ai-analyzing" style="display:none;align-items:center;justify-content:center;gap:8px;padding:12px;background:var(--surface);border-radius:12px;margin-bottom:16px">
      <i data-lucide="cpu" style="width:15px;height:15px;color:var(--accent);flex-shrink:0;animation:spin 1.2s linear infinite"></i>
      <p style="font-size:.8rem;color:var(--accent);font-weight:700">AI analyserar bilden…</p>
    </div>

    <div id="ai-suggestion-banner" style="display:none;background:var(--accent-dim);border:1px solid rgba(249,115,22,.3);border-radius:12px;padding:10px 14px;margin-bottom:12px;align-items:center;gap:8px">
      <i data-lucide="sparkles" style="width:15px;height:15px;color:var(--accent);flex-shrink:0"></i>
      <p style="font-size:.78rem;color:var(--accent);font-weight:700">AI-förslag — granska och godkänn</p>
    </div>

    <div class="flex flex-col gap-3">
      <input type="text" id="item-name" placeholder="Namn *">
      <textarea id="item-desc" placeholder="Beskrivning (valfritt)" rows="2"></textarea>

      <div id="lure-fields" style="display:none;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <input type="text" id="item-type"  placeholder="Typ">
        <input type="text" id="item-color" placeholder="Färg">
        <input type="number" id="item-size" placeholder="Vikt (g)" min="0" step="0.1">
      </div>

      <div>
        <div class="flex gap-2">
          <input type="text" id="tag-input" placeholder="Lägg till fiskart, t.ex. gädda">
          <button class="btn btn-ghost btn-sm" id="btn-add-tag" style="padding:10px 14px">
            <i data-lucide="plus" class="icon"></i>
          </button>
        </div>
        <div id="tag-list" class="flex flex-wrap gap-2 mt-2"></div>
        <p id="tag-hint" style="font-size:.72rem;color:var(--text-3);margin-top:6px;display:none">
          AI har lagt till taggar nedan – tryck × för att ta bort
        </p>
      </div>

      <div class="flex gap-3 pt-1">
        <button class="btn btn-ghost btn-half" id="btn-cancel">Avbryt</button>
        <button class="btn btn-primary btn-half" id="btn-save">Spara</button>
      </div>
    </div>
  </div>
</div>

<!-- Detalj-overlay -->
<div id="detail-overlay">
  <div class="detail-header">
    <button class="detail-close" id="detail-close">
      <i data-lucide="x" style="width:16px;height:16px;stroke:currentColor"></i>
    </button>
    <span class="detail-title" id="detail-title"></span>
  </div>
  <div id="detail-hero"></div>
  <div class="detail-body" id="detail-body"></div>
</div>

<!-- Crop-modal -->
<div id="crop-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:2000;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;flex-shrink:0">
    <button id="crop-cancel" style="background:var(--surface);border:none;color:var(--text-2);border-radius:12px;padding:10px 18px;font-family:inherit;font-size:.85rem;cursor:pointer">Avbryt</button>
    <p style="font-size:.85rem;font-weight:700;color:var(--text)">Beskär bild</p>
    <button id="crop-confirm" style="background:var(--accent);border:none;color:#fff;border-radius:12px;padding:10px 18px;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer">Klar ✓</button>
  </div>
  <div style="flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0 16px">
    <img id="crop-img" src="" alt="" style="max-width:100%;max-height:100%;display:block">
  </div>
  <p style="text-align:center;font-size:.75rem;color:var(--text-3);padding:12px">Nyp för att zooma · Dra för att flytta</p>
</div>

<nav id="bottom-nav"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
