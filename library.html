<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Curious Ember – Mitt bibliotek</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main style="padding:24px 16px 16px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <h1 style="font-size:22px;font-weight:700;color:#075985">Mitt bibliotek</h1>
    <button class="btn btn-ember" id="btn-add" style="padding:10px 16px;font-size:14px">+ Lägg till</button>
  </div>

  <!-- Tabs -->
  <div style="display:flex;background:#f3f4f6;border-radius:16px;padding:4px;margin-bottom:20px">
    <button class="tab-btn active" data-tab="rods" style="flex:1;padding:8px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s">🎣 Spön (<span id="rod-count">0</span>)</button>
    <button class="tab-btn" data-tab="lures" style="flex:1;padding:8px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;background:transparent;color:#6b7280">🪝 Beten (<span id="lure-count">0</span>)</button>
  </div>

  <div id="list-spinner" class="spinner">Laddar…</div>
  <div id="item-grid" class="equipment-grid" style="display:none"></div>
  <div id="empty-lib" class="empty-state" style="display:none">
    <div class="empty-icon" id="empty-icon">🎣</div>
    <p id="empty-text">Inga spön ännu</p>
    <button class="btn btn-primary" id="btn-add-empty" style="margin-top:16px;padding:10px 24px">Lägg till ditt första</button>
  </div>
</main>

<!-- Modal: lägg till / redigera -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end">
  <div style="background:#fff;border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:480px;margin:0 auto;max-height:90vh;overflow-y:auto">
    <h2 id="modal-title" style="font-size:18px;font-weight:700;margin-bottom:20px"></h2>

    <!-- Bild -->
    <div id="img-upload-area" style="height:160px;border-radius:16px;border:2px dashed #d1d5db;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:16px;overflow:hidden;background:#f9fafb" onclick="document.getElementById('file-input').click()">
      <img id="img-preview" src="" alt="" style="display:none;width:100%;height:100%;object-fit:contain;padding:8px">
      <div id="img-placeholder" style="text-align:center;color:#9ca3af">
        <div style="font-size:32px">📷</div>
        <p style="font-size:13px;margin-top:4px">Tryck för att lägga till bild</p>
      </div>
    </div>
    <input type="file" id="file-input" accept="image/*" style="display:none">

    <div style="display:flex;flex-direction:column;gap:12px">
      <input type="text" id="item-name" placeholder="Namn *">
      <textarea id="item-desc" placeholder="Beskrivning" rows="2" style="resize:none"></textarea>

      <!-- Bete-specifikt -->
      <div id="lure-fields" style="display:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <input type="text" id="item-type" placeholder="Typ">
        <input type="text" id="item-color" placeholder="Färg">
        <input type="text" id="item-size" placeholder="Storlek">
      </div>

      <!-- Taggar -->
      <div>
        <div style="display:flex;gap:8px">
          <input type="text" id="tag-input" placeholder="Tagg (t.ex. gädda, sommar)">
          <button class="btn btn-outline" id="btn-add-tag" style="padding:10px 14px;white-space:nowrap">+</button>
        </div>
        <div id="tag-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn btn-outline btn-half" id="btn-cancel">Avbryt</button>
        <button class="btn btn-ember btn-half" id="btn-save">Spara</button>
      </div>
    </div>
  </div>
</div>

<nav id="bottom-nav"></nav>
<script type="module" src="script.js"></script>
<style>
.tab-btn.active { background:#fff; color:#0284c7; box-shadow:0 1px 3px rgba(0,0,0,.1); }
#modal-overlay.open { display:flex; }
</style>
</body>
</html>
