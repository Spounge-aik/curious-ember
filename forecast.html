<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fiskeappen – Fiskeprognos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page-content" style="padding:20px 16px 40px">

  <div class="mb-5">
    <h1 class="text-xl font-bold">Fiskeprognos</h1>
    <p class="text-sm text-muted mt-1">7 dagar · välj sjö och art</p>
  </div>

  <!-- Filter -->
  <div class="mb-5" style="display:flex;flex-direction:column;gap:10px">

    <!-- Sjöval -->
    <div>
      <label class="section-title" style="display:block;margin-bottom:6px">Sjö</label>
      <select id="fc-lake" style="width:100%;padding:10px 12px;border-radius:var(--radius);
              background:var(--surface);border:1px solid var(--border-soft);
              color:var(--text);font-family:inherit;font-size:.9rem">
        <option value="">Välj sjö…</option>
      </select>
    </div>

    <!-- Fiskart -->
    <div>
      <label class="section-title" style="display:block;margin-bottom:6px">Fiskart</label>
      <div id="fc-fish-chips" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>

  </div>

  <!-- Skeleton -->
  <div id="fc-skeleton" style="display:none;flex-direction:column;gap:10px">
    <div class="skeleton skeleton-card" style="height:90px"></div>
    <div class="skeleton skeleton-card" style="height:90px"></div>
    <div class="skeleton skeleton-card" style="height:90px"></div>
    <div class="skeleton skeleton-card" style="height:90px"></div>
    <div class="skeleton skeleton-card" style="height:90px"></div>
    <div class="skeleton skeleton-card" style="height:90px"></div>
    <div class="skeleton skeleton-card" style="height:90px"></div>
  </div>

  <!-- Prognoskort -->
  <div id="fc-list" style="display:flex;flex-direction:column;gap:10px"></div>

  <!-- Tom state -->
  <div id="fc-empty" style="display:none;text-align:center;padding:40px 0;color:var(--text-3)">
    <i data-lucide="cloud-off" style="width:40px;height:40px;margin:0 auto 12px"></i>
    <p>Välj en sjö och fiskart för att se prognosen</p>
  </div>

</main>

<nav id="bottom-nav"></nav>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
