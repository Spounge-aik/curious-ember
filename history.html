<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fiskeappen – Mitt Fiske</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page-content" style="padding:20px 16px">

  <div class="mb-6">
    <h1 class="text-xl font-bold">Mitt Fiske</h1>
    <p class="text-sm text-muted mt-1">Dina fisketurer och historik</p>
  </div>

  <a href="index.html" class="btn btn-primary btn-full btn-lg btn-pulse mb-8"
     style="display:flex;text-decoration:none">
    <i data-lucide="fish" class="icon"></i> Starta ny fisketur
  </a>

  <div id="hist-skeleton">
    <p class="section-title">Senaste turer</p>
    <div class="flex flex-col gap-2">
      <div class="card card-body">
        <div class="skeleton skeleton-text mb-2" style="width:55%"></div>
        <div class="skeleton skeleton-text" style="width:38%"></div>
      </div>
      <div class="card card-body">
        <div class="skeleton skeleton-text mb-2" style="width:62%"></div>
        <div class="skeleton skeleton-text" style="width:42%"></div>
      </div>
      <div class="card card-body">
        <div class="skeleton skeleton-text mb-2" style="width:48%"></div>
        <div class="skeleton skeleton-text" style="width:35%"></div>
      </div>
    </div>
  </div>

  <div id="hist-content" style="display:none">
    <p class="section-title">Senaste turer</p>
    <div id="hist-list" class="flex flex-col gap-2"></div>
  </div>

  <div id="hist-empty" class="empty-state" style="display:none">
    <i data-lucide="map" class="empty-icon-svg"></i>
    <p class="font-bold mb-1">Inga fisketurer ännu</p>
    <p class="text-sm text-muted">Starta din första fisketur ovan!</p>
  </div>

</main>

<nav id="bottom-nav"></nav>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
