<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Curious Ember – Logga in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main style="padding:64px 24px 24px;max-width:380px;margin:0 auto">

  <div style="text-align:center;margin-bottom:40px">
    <div style="font-size:48px;margin-bottom:12px">🔥</div>
    <h1 style="font-size:1.3rem;letter-spacing:-.01em">Curious Ember</h1>
    <p id="mode-subtitle" class="text-muted text-sm" style="margin-top:6px">Logga in för att fortsätta</p>
  </div>

  <div id="error-msg" class="alert alert-error" style="display:none;margin-bottom:16px"></div>
  <div id="success-msg" class="alert alert-success" style="display:none;margin-bottom:16px"></div>

  <div style="display:flex;flex-direction:column;gap:12px">
    <input type="email" id="email" placeholder="E-postadress" autocomplete="email">
    <input type="password" id="password" placeholder="Lösenord" autocomplete="current-password">
    <button class="btn btn-primary btn-full btn-lg" id="btn-submit">Logga in</button>
  </div>

  <div class="divider" style="margin:24px 0"></div>

  <p style="text-align:center;font-size:.78rem;color:var(--text-3)">
    <span id="mode-switch-text">Inget konto?</span>
    <button id="btn-mode" style="background:none;border:none;color:var(--accent);font-family:inherit;font-weight:700;cursor:pointer;font-size:.78rem;margin-left:6px">Registrera dig</button>
  </p>

</main>

<script type="module" src="script.js"></script>
</body>
</html>
