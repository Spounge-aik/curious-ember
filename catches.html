<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fiskeappen – Fångster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page-content" style="padding:20px 16px">

  <div class="mb-6">
    <h1 class="text-xl font-bold">Fångade fiskar</h1>
    <p class="text-sm text-muted mt-1">Din fångsthistorik och statistik</p>
  </div>

  <!-- Skeleton loader -->
  <div id="catches-skeleton">
    <div class="skeleton skeleton-card mb-4" style="height:90px"></div>
    <div class="skeleton skeleton-card mb-6" style="height:200px"></div>
    <div class="flex flex-col gap-3">
      <div class="skeleton skeleton-card" style="height:80px"></div>
      <div class="skeleton skeleton-card" style="height:80px"></div>
    </div>
  </div>

  <!-- Innehåll -->
  <div id="catches-content" style="display:none">

    <!-- Personliga rekord -->
    <div class="mb-6">
      <p class="section-title mb-3">Personliga rekord</p>
      <div id="records-row" style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch"></div>
    </div>

    <!-- Månadsstatistik -->
    <div class="mb-6">
      <p class="section-title mb-3">Fångster per månad</p>
      <div style="background:var(--surface);border-radius:var(--radius-lg);padding:16px;border:1px solid var(--border-soft)">
        <canvas id="chart-monthly" style="max-height:200px"></canvas>
      </div>
    </div>

    <!-- Dygnsfördelning -->
    <div class="mb-6">
      <p class="section-title mb-3">När fiskar du bäst?</p>
      <div style="background:var(--surface);border-radius:var(--radius-lg);padding:16px;border:1px solid var(--border-soft)">
        <canvas id="chart-hourly" style="max-height:160px"></canvas>
      </div>
    </div>

    <!-- Väderkoppling -->
    <div id="weather-stats-section" class="mb-6" style="display:none">
      <p class="section-title mb-3">Väderkoppling</p>
      <div id="weather-stats-content"
           style="background:var(--surface);border-radius:var(--radius-lg);padding:14px 16px;border:1px solid var(--border-soft);font-size:.85rem;color:var(--text-2);line-height:1.8"></div>
    </div>

    <!-- Lista -->
    <div>
      <p class="section-title mb-3">Alla fångster</p>
      <div id="catches-list" class="flex flex-col gap-3"></div>
    </div>

  </div>

  <!-- Tom-state -->
  <div id="catches-empty" class="empty-state" style="display:none">
    <i data-lucide="fish" class="empty-icon-svg"></i>
    <p class="font-bold mb-1">Inga fångster registrerade ännu</p>
    <p class="text-sm text-muted mb-5">Starta en fisketur och registrera din första fångst!</p>
    <a href="index.html" class="btn btn-primary" style="text-decoration:none">
      <i data-lucide="map" class="icon"></i> Hitta sjö
    </a>
  </div>

</main>

<!-- Detalj-overlay -->
<div id="detail-overlay">
  <div class="detail-header">
    <button class="detail-close" id="detail-close">
      <i data-lucide="x" style="width:16px;height:16px;stroke:currentColor"></i>
    </button>
    <span class="detail-title" id="detail-title"></span>
  </div>
  <div id="detail-hero"></div>
  <div class="detail-body" id="detail-body"></div>
</div>

<nav id="bottom-nav"></nav>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script type="module" src="script.js"></script>
</body>
</html>
