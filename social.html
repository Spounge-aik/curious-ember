<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Fiskeappen – Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header" id="app-header"></header>
<main class="page-content" style="padding:20px 16px 40px">

  <div class="mb-5">
    <h1 class="text-xl font-bold">Social</h1>
    <p class="text-sm text-muted mt-1">Vänner och fångstfeed</p>
  </div>

  <!-- Sök användare -->
  <div class="mb-5">
    <div style="display:flex;gap:8px">
      <input id="friend-search" type="text" placeholder="Sök på användarnamn…"
             autocomplete="off" autocapitalize="none" style="flex:1">
      <button id="btn-friend-search" class="btn btn-surface">
        <i data-lucide="search" style="width:16px;height:16px"></i>
      </button>
    </div>
    <div id="search-results" style="margin-top:8px;display:flex;flex-direction:column;gap:6px"></div>
  </div>

  <!-- Inkommande vänförfrågningar -->
  <div id="requests-section" style="display:none;margin-bottom:20px">
    <p class="section-title mb-3">Vänförfrågningar</p>
    <div id="requests-list" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <!-- Feed -->
  <div>
    <p class="section-title mb-3">Flöde</p>
    <div id="feed-skeleton" style="display:flex;flex-direction:column;gap:10px">
      <div class="skeleton skeleton-card" style="height:80px"></div>
      <div class="skeleton skeleton-card" style="height:80px"></div>
      <div class="skeleton skeleton-card" style="height:80px"></div>
    </div>
    <div id="feed-list" style="display:none;flex-direction:column;gap:10px"></div>
    <div id="feed-empty" style="display:none;text-align:center;padding:32px 0;color:var(--text-3)">
      <i data-lucide="users" style="width:36px;height:36px;margin:0 auto 10px"></i>
      <p class="font-bold mb-1">Inga vänner ännu</p>
      <p class="text-sm">Sök efter vänner ovan och lägg till dem</p>
    </div>
  </div>

</main>
<nav id="bottom-nav"></nav>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
